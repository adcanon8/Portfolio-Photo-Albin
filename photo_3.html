<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ÉVÉNEMENT</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: "DM Sans", sans-serif;
            min-height: 100vh;
        }

        .photo-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        .back {
            align-self: flex-start;
            color: white;
            text-decoration: none;
            margin-bottom: 40px;
        }

        .back:hover {
            opacity: 0.6;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        img {
            max-width: 80%;
            max-height: 70vh;
            object-fit: contain;
        }

        .info {
            margin-top: 35px;
            text-align: center;
        }

        .info h2 {
            margin-bottom: 20px;
        }

        .info p {
            color: #aaa;
            margin: 8px 0;
        }
    </style>

</head>

<body>

    <div class="photo-page">

        <a href="index.html" class="back">
            ← Retour
        </a>

        <h1>ÉVÉNEMENT</h1>

        <img
            src="SCRL_0041.JPG"
            alt="Photographie d'événement"
        >

        <div class="info">

            <h2>Paramètres</h2>

            <p>Appareil : Canon R8</p>
            <p>Objectif : Canon RF 50mm F/1.8 STM</p>
            <p>Ouverture : f/3.5</p>
            <p>ISO : 160</p>
            <p>Vitesse : 1/1000 s</p>
            <p>Focale : 50 mm</p>

        </div>

    </div>

</body>

</html>
